# The site on a port of its own, before any DNS is moved.
#
# No TLS and no server_name: it answers on http://<server-ip>:PREVIEW_PORT so
# the whole site — panels, uploads, live rooms — can be walked through on the
# server it will actually run on. It sets noindex, because a second copy of a
# site must never compete with the real one in search.
server {
  listen PREVIEW_PORT;
  listen [::]:PREVIEW_PORT;
  server_name _;

  add_header X-Robots-Tag "noindex, nofollow" always;

  client_max_body_size 64m;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;

  location /_next/static/ {
    alias /var/www/skillforcareer/current/.next/static/;
    access_log off;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    proxy_pass http://127.0.0.1:APP_PORT;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
