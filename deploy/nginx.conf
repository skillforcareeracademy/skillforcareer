# nginx in front of the Next.js server.
#
# Two jobs only: terminate TLS, and pass everything to node on 127.0.0.1:3000.
# Uploads go through the app (they land in the database/object store), so the
# body limit has to be generous enough for a CV or a recording thumbnail.

upstream skillforcareer_app {
  server 127.0.0.1:3000;
  keepalive 32;
}

server {
  listen 80;
  listen [::]:80;
  server_name SERVER_NAME;

  # certbot writes its challenge here; everything else goes to https.
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name SERVER_NAME;

  ssl_certificate     /etc/letsencrypt/live/SERVER_NAME/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/SERVER_NAME/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  client_max_body_size 64m;
  # A learner on a slow connection uploading a CV shouldn't be cut off.
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Built assets are content-hashed, so they can be cached hard.
  location /_next/static/ {
    alias /var/www/skillforcareer/current/.next/static/;
    access_log off;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # The signalling socket for live classes, if this box also runs it.
  location /signal {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  location / {
    proxy_pass http://skillforcareer_app;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
  }
}
